<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ブーメラン野郎！ 実ゲームPV 書き出し</title>
<style>body{margin:0;background:#07111d;color:#fff;font-family:system-ui,sans-serif;text-align:center}main{max-width:1000px;margin:auto;padding:24px}canvas{display:block;width:100%;border:1px solid #6f8199;background:#101b2b}iframe{position:absolute;width:1px;height:1px;left:-9999px;border:0}button{margin:18px;padding:14px 24px;border:0;border-radius:8px;background:#f6a532;color:#1d1307;font-weight:800;font-size:16px;cursor:pointer}p{color:#c9d6e4}</style>
<main><h1>ブーメラン野郎！ 実ゲームPV</h1><canvas id="pv" width="1280" height="720"></canvas><button id="export">戦闘シーンPVを書き出す（WebM）</button><p id="status">ゲーム画面を読み込み中…</p></main><iframe id="game" src="index.html?dev=1"></iframe>
<script>
const out=document.querySelector('#pv'),ctx=out.getContext('2d'),frame=document.querySelector('#game'),status=document.querySelector('#status'),music=new Audio('assets/audio/battle.mp3');music.preload='auto';let source,dev,ready=false;
frame.addEventListener('load',()=>{const wait=()=>{dev=frame.contentWindow.BoomerangDev;source=frame.contentWindow.document.getElementById('game');if(dev&&source){ready=true;status.textContent='準備完了。実際のゲーム画面だけを録画します。';preview()}else setTimeout(wait,100)};wait()});
function paint(){if(source)ctx.drawImage(source,0,0,1280,720)}function preview(){paint();requestAnimationFrame(preview)}
const cues={};function once(name,when,fn,t){if(t>=when&&!cues[name]){cues[name]=true;fn()}}function cue(t){once('stage1',2,()=>{dev.startBattle(1);dev.setPlayer(300,580)},t);once('throw1',3.1,()=>dev.throw(),t);once('stage3',7,()=>{dev.startBattle(3);dev.setPlayer(310,580)},t);once('throw3',8.4,()=>dev.throw(),t);once('stage4',12,()=>{dev.startBattle(4);dev.setPlayer(315,580)},t);once('throw4',13.7,()=>dev.throw(),t);once('stage5',18,()=>{dev.startBattle(5);dev.setPlayer(280,590)},t);once('throw5',20.1,()=>dev.throw(),t);}
async function exportPV(){if(!ready||!window.MediaRecorder){status.textContent='まだ準備中です。少し待ってからもう一度押してください。';return}const stream=out.captureStream(30),chunks=[];let ac,dest;try{ac=new AudioContext();const node=ac.createMediaElementSource(music);dest=ac.createMediaStreamDestination();node.connect(dest);node.connect(ac.destination);await ac.resume();music.currentTime=0;await music.play();dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}catch{}let rec;try{rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus'})}catch{rec=new MediaRecorder(stream)}rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{music.pause();ac?.close();const url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'})),a=document.createElement('a');a.href=url;a.download='boomerang-yaro-gameplay-pv.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);status.textContent='実ゲームPVを書き出しました。'};const started=performance.now();rec.start(250);status.textContent='録画中…約24秒かかります。';function record(now){const t=(now-started)/1000;cue(t);paint();if(t<24)requestAnimationFrame(record);else rec.stop()}requestAnimationFrame(record)}
document.querySelector('#export').onclick=exportPV;
</script></html>
