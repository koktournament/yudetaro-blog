{{- if eq .Section "entry" }}
<div class="blog-comments" data-page="{{ .RelPermalink }}">
  <h2>コメント</h2>
  <div class="bc-list"></div>
  <form class="bc-form">
    <p class="bc-note">名前だけで投稿できます（アカウント不要）。コメントは承認後に表示されます。</p>
    <input type="text" name="name" maxlength="40" placeholder="名前" required>
    <textarea name="body" rows="4" maxlength="2000" placeholder="コメント" required></textarea>
    <input type="text" name="website" class="bc-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">投稿する</button>
    <p class="bc-msg"></p>
  </form>
</div>
<style>
.blog-comments{margin-top:3em}
.blog-comments h2{font-size:1.3em;margin-bottom:.8em}
.bc-item{border-top:1px solid var(--border);padding:.7em 0}
.bc-head{margin:0}
.bc-date{color:var(--secondary);font-size:.85em;margin-left:.5em}
.bc-body{white-space:pre-wrap;margin:.3em 0 0}
.bc-empty{color:var(--secondary)}
.bc-form{margin-top:1.5em}
.bc-note{color:var(--secondary);font-size:.9em}
.bc-form input[type=text],.bc-form textarea{display:block;width:100%;box-sizing:border-box;margin:.5em 0;padding:.5em;border:1px solid var(--border);border-radius:6px;background:var(--theme);color:var(--primary);font:inherit}
.bc-form button{padding:.5em 1.5em;border:1px solid var(--border);border-radius:6px;background:var(--entry);color:var(--primary);cursor:pointer;font:inherit}
.bc-hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;opacity:0}
.bc-msg{color:var(--secondary)}
</style>
<script>
(function () {
  var root = document.querySelector('.blog-comments');
  if (!root) return;
  var page = root.getAttribute('data-page');
  var list = root.querySelector('.bc-list');
  function fmt(ts) { return new Date(ts).toLocaleString('ja-JP'); }
  function load() {
    fetch('/api/comments?page=' + encodeURIComponent(page)).then(function (r) { return r.json(); }).then(function (d) {
      list.textContent = '';
      if (!d.comments || !d.comments.length) {
        var p = document.createElement('p'); p.className = 'bc-empty'; p.textContent = 'まだコメントはありません。';
        list.appendChild(p); return;
      }
      d.comments.forEach(function (c) {
        var div = document.createElement('div'); div.className = 'bc-item';
        var head = document.createElement('p'); head.className = 'bc-head';
        var nm = document.createElement('strong'); nm.textContent = c.name;
        var dt = document.createElement('span'); dt.className = 'bc-date'; dt.textContent = fmt(c.ts);
        head.appendChild(nm); head.appendChild(dt);
        var bd = document.createElement('p'); bd.className = 'bc-body'; bd.textContent = c.body;
        div.appendChild(head); div.appendChild(bd); list.appendChild(div);
      });
    }).catch(function () {});
  }
  var form = root.querySelector('.bc-form');
  var msg = root.querySelector('.bc-msg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var fd = new FormData(form);
    var payload = { page: page, name: fd.get('name'), body: fd.get('body'), hp: fd.get('website') };
    fetch('/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (d.ok) { msg.textContent = '投稿ありがとうございます。承認後に表示されます。'; form.reset(); }
        else { msg.textContent = d.error || '投稿できませんでした'; }
      }).catch(function () { msg.textContent = '投稿できませんでした'; });
  });
  load();
})();
</script>
{{- end }}
